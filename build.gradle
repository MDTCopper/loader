
// JitPack publishes with -Pversion=<the version it resolves the artifacts under>, so they must carry
// exactly that string: a tag ("0.2.0") is a release, the snapshot channel, a -SNAPSHOT request and a
// bare commit are not. Without a version, -Prelease names a release and anything else a snapshot.

// the declared version, read before the ext below takes the buildVersion name over
def declaredVersion = property('buildVersion')

def requested = project.findProperty('version')?.toString()?.trim()
if (requested == '' || requested == 'unspecified')
    requested = null

// "snapshot", a -SNAPSHOT request and a bare commit hash all name a snapshot.
def snapshotRequested = requested == null
        || requested.equalsIgnoreCase('snapshot')
        || requested.toLowerCase().endsWith('-snapshot')
        || requested ==~ /(?i)[0-9a-f]{7,40}/

def release = project.hasProperty('release') || !snapshotRequested
def loaderVersion = release ? (requested ?: declaredVersion) : (requested ?: 'snapshot')

// A snapshot publishes under its own name but keeps the declared version inside: mod dependency checks
// parse that number, and a tag that is not a plain number ("v0.2.0") cannot be parsed at all.
def runtimeVersion = release ? loaderVersion : declaredVersion
if (!(runtimeVersion ==~ /\d+(\.\d+)*([-+][0-9A-Za-z.\-]+)?/))
    runtimeVersion = declaredVersion

// A snapshot cannot say by its own version which code is inside, so it carries the commit it was built
// from. Only a commit the remote has counts - a local commit, a dirty tree or no git is custom, and
// says so. The CI passes what it pushed with -PbuildCommit.
def gitQuery = { List<String> args ->
    def out = new ByteArrayOutputStream()
    try {
        def execOps = project.services.get(org.gradle.process.ExecOperations)
        def result = execOps.exec { spec ->
            spec.commandLine(['git'] + args)
            spec.workingDir = rootProject.projectDir
            spec.standardOutput = out
            spec.errorOutput = new ByteArrayOutputStream()
            spec.ignoreExitValue = true
        }
        return result.exitValue == 0 ? out.toString('UTF-8').trim() : null
    } catch (Throwable ignored) {
        return null
    }
}
def commit = ''
def custom = false
if (!release) {
    def passed = project.findProperty('buildCommit')
    def fromCi = System.getenv('GITHUB_SHA')
    if (passed != null && !passed.trim().isEmpty()) {
        commit = passed.trim().take(7)
    } else {
        def head = gitQuery(['rev-parse', '--verify', '--short', 'HEAD'])
        if (head != null) {
            def onRemote = gitQuery(['branch', '--remotes', '--contains', 'HEAD'])
            def changes = gitQuery(['status', '--porcelain'])
            if (onRemote != null && !onRemote.isEmpty() && changes != null && changes.isEmpty())
                commit = head
            else
                custom = true
        } else if (fromCi != null && !fromCi.trim().isEmpty()) {
            commit = fromCi.trim().take(7)
        } else {
            custom = true
        }
    }
}

logger.lifecycle("loader ${loaderVersion} (" + (release ? 'release' : 'snapshot')
        + (custom ? ', custom' : commit ? ", ${commit}" : '') + ')')

allprojects {
    repositories {
        mavenLocal()
        mavenCentral()
        maven { url =  'https://www.jitpack.io' }
        maven { url =  'https://maven.google.com' }
    }

    ext {
        buildVersion = loaderVersion
        // the numeric version stamped into the jar: a release's own, a snapshot's declared one
        releaseVersion = runtimeVersion
        buildSnapshot = !release
        buildCommit = commit
        buildCustom = custom
        asmVersion = property("asmVersion")
        mixinVersion = property("mixinVersion")
        // for core mod
        gameVersion = property("gameVersion")
    }
}

subprojects {
    if (project.name != "tools") {
        apply plugin: 'java-library'
        apply plugin: "maven-publish"

        group = "com.github.MDTCopper.loader"
        version = buildVersion

        tasks.register('sourcesJar', Jar) {
            from sourceSets.main.allJava
            archiveClassifier.set('sources')
        }

        tasks.withType(Javadoc).configureEach {
            options.encoding = 'UTF-8'
            options.locale = 'en_US'
            options.addStringOption('Xdoclint:none', '-quiet')
            options.JFlags = ['-Duser.language=en', '-Duser.country=US']
        }

        tasks.register('javadocJar', Jar) {
            archiveClassifier.set('javadoc')
            from javadoc
        }

        publishing {
            publications {
                mavenJava(MavenPublication) {
                    from components.java
                    artifact sourcesJar
                    artifact javadocJar
                }
            }
        }
    }

    tasks.withType(JavaCompile).tap {
        configureEach {
            options.encoding = 'UTF-8'
            options.compilerArgs += ['-Xlint:deprecation']
        }
    }
}
