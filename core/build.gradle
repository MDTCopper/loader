
apply plugin: 'java-library'

sourceSets {
    main {
        java.srcDirs = ["src"]
        resources.srcDirs = ["res"]
    }
}

dependencies {
    implementation "com.github.google.guava:guava:v21.0"
    implementation "com.google.code.gson:gson:2.8.9"

    api "org.ow2.asm:asm-tree:$asmVersion"
    api "org.ow2.asm:asm-commons:$asmVersion"
    api "org.ow2.asm:asm-util:$asmVersion"

    api "com.github.MDTCopper:Mixin:$mixinVersion"
}

// The stamp the loader reads back at runtime. A snapshot keeps the declared version, because mod
// dependency checks parse this number, and says it is a snapshot instead: what the startup lines print
// is then the commit, or that this is a custom build. Read here, where the task cannot see them.
def stampVersion = releaseVersion
def stampSnapshot = buildSnapshot
def stampCommit = buildCommit
def stampCustom = buildCustom

tasks.register('writeVersion') {
    def projectDir = project(':core').projectDir

    doLast {
        def pfile = new File(projectDir, 'res/version.properties')
        def props = new Properties()
        def write = true

        def values = [version: stampVersion]
        if (stampSnapshot) values.snapshot = 'true'
        if (stampCustom) values.custom = 'true'
        else if (stampCommit) values.commit = stampCommit

        if (pfile.exists()) {
            props.load(new FileInputStream(pfile))
            // a key left over from an earlier build is a difference as well, hence the size check
            def same = props.size() == values.size()
            values.each { key, value -> if (props[key] != value) same = false }
            if (same)
                write = false
        } else {
            try {
                pfile.createNewFile()
            } catch (Exception ignored) {
            }
        }

        if (write) {
            println("Compiling with version: '$stampVersion'" + (stampSnapshot ? ' (snapshot)' : ''))
            props.clear()
            values.each { key, value -> props[key] = value }
            props.store(pfile.newWriter(), "Autogenerated file. Do not modify.")
        }
    }
}

processResources.dependsOn(writeVersion)
