
apply plugin: "java-library"

sourceSets {
    main {
        java.srcDirs = ["src"]
        resources.srcDirs = ["res"]
    }
}

dependencies {
    implementation "com.github.google.guava:guava:v21.0"
    implementation "com.google.code.gson:gson:2.8.9"

    if (Float.parseFloat(asmVersion) < 6) {
        api "org.ow2.asm:asm-debug-all:$asmVersion"
    }

    api "org.ow2.asm:asm-tree:$asmVersion"
    api "org.ow2.asm:asm-commons:$asmVersion"
    api "org.ow2.asm:asm-util:$asmVersion"

    api "com.github.MDTCopper:Mixin:$mixinVersion"
}

task writeVersion {
    doLast {
        def pfile = new File(project(':core').projectDir, 'res/version.properties')
        def props = new Properties()

        try {
            pfile.createNewFile()
        } catch (Exception ignored) {}

        if (pfile.exists()) {
            props.load(new FileInputStream(pfile))
            println("Compiling with version: '$buildVersion'")
            props["version"] = buildVersion
            props.store(pfile.newWriter(), "Autogenerated file. Do not modify.")
        }
    }
}

jar.dependsOn(writeVersion)
